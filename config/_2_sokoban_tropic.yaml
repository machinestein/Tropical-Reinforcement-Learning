defaults:
  - sokoban_state_common
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

trainer:
  method: tropic
  experiment_name: sokoban-tropic
  project_name: ragen_tropic
  default_local_dir: model_saving/tropic/${trainer.experiment_name}
  resume_mode: disable
  logger: [console]

critic:
  enable: false

actor_rollout_ref:
  actor:
    ppo_epochs: 2
  rollout:
    calculate_log_probs: true

es_manager:
  train:
    group_size: 8

tropic:
  collection_only: false
  waves_per_iteration: 2
  frontier_enabled: true
  composition_enabled: true
  coverage_enabled: true
  frontier_eta: 1.0
  top_l: 4
  basis_size: 2
  max_edges_per_problem: 1024
  max_solutions_per_problem: 64
  max_candidates_per_refresh: 64
  rescore_batch_size: 64
