trainer:
  method: tropic
  experiment_name: countdown-tropic
  project_name: RAGEN_COUNTDOWN
  resume_mode: disable

critic:
  enable: false

agent_proxy:
  context_window_mode: single_turn
  max_context_window: 1
  max_turn: 5
  max_actions_per_turn: 1
  reject_extra_actions: true
  terminate_on_invalid_action: true
  root_diagnostics: true

collapse_detection:
  multi_turn_enabled: false

actor_rollout_ref:
  actor:
    use_ref: false
    entropy_coeff: 0.0
    ppo_epochs: 2
  rollout:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    calculate_log_probs: true

custom_envs:
  Countdown:
    env_type: countdown_step
    max_actions_per_traj: 5
    env_instruction: |
      You are solving the Countdown puzzle one operation at a time. You see the target and the numbers that are currently available.
      Your answer must be exactly ONE operation between exactly TWO numbers taken from the current list, written as "a + b", "a - b", "a * b" or "a / b", nothing else.
      The result replaces the two numbers; you then get the new list and answer again. Reach the target by the time every number has been used exactly once.
      Fractions and negative intermediate values are allowed; division by zero is not.
      Invalid answers END the episode: a full expression with several operators (e.g. "15/5 * 17 + 7"), a number that is not in the current list, decimals, or text.
      Example with numbers [3, 5, 2] and target 4: first response <think>2 + 5 = 7, then 7 - 3 = 4.</think><answer>2 + 5</answer>; the list becomes [3, 7]; next response <answer>7 - 3</answer>.
    max_tokens: 100
    parallel_friendly: false
    max_workers: 32
    env_config:
      train_path: data/countdown/tropic_train.parquet
      max_instances: 2048
      solvable_filter: false
      max_steps: 5

es_manager:
  train:
    env_groups: 8
    group_size: 8
    seed_pool_size: 128
    env_configs:
      tags: [Countdown]
      n_groups: [8]
  val:
    env_groups: 512
    group_size: 1
    env_configs:
      tags: [Countdown]
      n_groups: [512]
    env_config_overrides:
      Countdown:
        train_path: data/countdown/tropic_val.parquet
        max_instances: 512

tropic:
  collection_only: false
  waves_per_iteration: 2
  frontier_enabled: true
  composition_enabled: true
  coverage_enabled: true
  frontier_eta: 1.0
  top_l: 4
  basis_size: 2
  max_edges_per_problem: 1024
  max_solutions_per_problem: 64
  max_candidates_per_refresh: 64
  rescore_batch_size: 64
