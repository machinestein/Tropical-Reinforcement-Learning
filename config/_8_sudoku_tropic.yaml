defaults:
  - base
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

trainer:
  method: tropic
  experiment_name: sudoku-tropic
  project_name: RAGEN_SUDOKU
  resume_mode: disable

critic:
  enable: false

agent_proxy:
  context_window_mode: single_turn
  max_context_window: 1
  max_turn: 40
  max_actions_per_turn: 1
  reject_extra_actions: true
  terminate_on_invalid_action: true
  root_diagnostics: true

collapse_detection:
  multi_turn_enabled: false

actor_rollout_ref:
  actor:
    use_ref: false
    entropy_coeff: 0.0
    ppo_epochs: 2
  rollout:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    calculate_log_probs: true

custom_envs:
  SimpleSudoku:
    env_type: sudoku_tropic
    max_actions_per_traj: 40
    env_instruction: |
      You are solving a Sudoku puzzle. Fill in the grid so that every row, column, and 3x3 box contains the numbers 1-9 without repetition.
      Given cells are shown in [brackets] and cannot be modified. Empty cells are shown as dots (.).
      Place exactly one number per response using the format: <answer>place 5 at row 2 col 3</answer> or <answer>2,3,5</answer>
      A placement that breaks the rules or targets a given cell ends the episode.
    env_config:
      grid_size: 9
      max_steps: 81

es_manager:
  train:
    env_groups: 8
    group_size: 8
    seed_pool_size: 128
    env_configs:
      tags: [SimpleSudoku]
      n_groups: [8]
  val:
    env_groups: 32
    group_size: 16
    env_configs:
      tags: [SimpleSudoku]
      n_groups: [32]

tropic:
  collection_only: false
  waves_per_iteration: 2
  frontier_enabled: true
  composition_enabled: true
  coverage_enabled: true
  frontier_eta: 1.0
  top_l: 4
  basis_size: 2
  max_edges_per_problem: 1024
  max_solutions_per_problem: 64
  max_candidates_per_refresh: 64
  rescore_batch_size: 64
