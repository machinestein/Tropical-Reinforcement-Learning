defaults:
  - lean_light_common
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

trainer:
  method: tropic
  experiment_name: lean-tropic
  resume_mode: disable

critic:
  enable: false

agent_proxy:
  context_window_mode: single_turn
  max_context_window: 1
  max_turn: 30
  max_actions_per_turn: 1
  reject_extra_actions: true
  terminate_on_invalid_action: true
  root_diagnostics: true

collapse_detection:
  multi_turn_enabled: false

actor_rollout_ref:
  actor:
    use_ref: false
    entropy_coeff: 0.0
    ppo_epochs: 2
  rollout:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    calculate_log_probs: true

custom_envs:
  Lean:
    env_type: lean_tropic
    env_instruction: |
      You are a Lean theorem prover. Complete the theorem from the current goals.
      Think step by step, then provide exactly one tactic in <answer>...</answer>.
    env_config:
      sample_mode: sequential
      request_infotree: false  # unused payload; large info trees have triggered server-side serialization failures

es_manager:
  train:
    seed_pool_size: 128
    group_size: 8

tropic:
  collection_only: false
  waves_per_iteration: 2
  frontier_enabled: true
  composition_enabled: true
  coverage_enabled: true
  frontier_eta: 1.0
  top_l: 4
  basis_size: 2
  max_edges_per_problem: 1024
  max_solutions_per_problem: 64
  max_candidates_per_refresh: 64
  rescore_batch_size: 64
