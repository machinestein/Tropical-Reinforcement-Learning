defaults:
  - base
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

micro_batch_size_per_gpu: 4
ppo_mini_batch_size: 32
model_path: Qwen/Qwen2.5-3B-Instruct

trainer:
  method: tropic
  experiment_name: webshop-tropic
  project_name: RAGEN_WEBSHOP
  resume_mode: disable

critic:
  enable: false

agent_proxy:
  context_window_mode: single_turn
  max_context_window: 1
  max_turn: 9
  max_actions_per_turn: 1
  reject_extra_actions: true
  terminate_on_invalid_action: true
  root_diagnostics: true

collapse_detection:
  multi_turn_enabled: false

actor_rollout_ref:
  actor:
    use_ref: false
    entropy_coeff: 0.0
    ppo_epochs: 2
  rollout:
    max_model_len: 15000
    max_num_batched_tokens: 15000
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    calculate_log_probs: true

custom_envs:
  WebShop:
    env_type: webshop_tropic
    env_instruction: >-
      Buy a product satisfying the shopping instruction, including its requested
      attributes, options and price limit. You see the current page, selected
      options and remaining action budget. Choose exactly one action from the
      available actions on this page and put it inside <answer>...</answer>.
      For a click, copy exactly one complete action from the list. Search is
      possible only when a search action is available; use a short query naming
      the product and its key attributes. On a product page, select a requested
      option only if it is not already selected. If several options are missing,
      select just one now and wait for the next page before selecting another.
      Once the requested options are selected, buy the product. Each response
      executes only one action. End the response immediately after </answer>.
    env_config:
      max_steps: 9

es_manager:
  train:
    group_size: 8
    seed_pool_size: 128
    env_configs:
      tags: [WebShop]
  val:
    env_configs:
      tags: [WebShop]

tropic:
  collection_only: false
  waves_per_iteration: 2
  frontier_enabled: true
  composition_enabled: true
  coverage_enabled: true
  frontier_eta: 1.0
  top_l: 4
  basis_size: 2
  max_edges_per_problem: 1024
  max_solutions_per_problem: 64
  max_candidates_per_refresh: 64
  rescore_batch_size: 64
